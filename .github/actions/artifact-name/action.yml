name: Artifact filename
description: Generate a branch or pull request artifact filename
inputs:
  prefix:
    description: Filename prefix
    required: true
  extension:
    description: Filename extension
    required: true
outputs:
  name:
    description: Generated artifact filename
    value: ${{ steps.filename.outputs.name }}
runs:
  using: composite
  steps:
    - id: filename
      uses: actions/github-script@v9
      env:
        REF_NAME: ${{ github.ref_name }}
        ARTIFACT_PREFIX: ${{ inputs.prefix }}
        ARTIFACT_EXTENSION: ${{ inputs.extension }}
      with:
        script: |
          const suffix = context.eventName === 'pull_request'
            ? `pr-${context.payload.pull_request.number}`
            : process.env.REF_NAME.replace(/[^A-Za-z0-9._-]/g, '-');
          core.setOutput('name', `${process.env.ARTIFACT_PREFIX}-${suffix}.${process.env.ARTIFACT_EXTENSION}`);